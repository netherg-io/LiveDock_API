name: docker-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: livedock-deployment
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/netherg-io/livedock-api
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Queue deployment through Dokploy webhook
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          test -n "$WEBHOOK" || { echo "::error::DOKPLOY_WEBHOOK_URL is missing"; exit 1; }
          curl --silent --fail --max-time 30 --output /dev/null -X POST "$WEBHOOK"
          echo 'Deployment queued in Dokploy; check the Compose rollout.' >> "$GITHUB_STEP_SUMMARY"
